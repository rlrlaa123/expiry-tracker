<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아카이브 — UI 목업</title>
<style>
  :root{
    --bg:#ECEAE4; --surface:#FFFFFF; --canvas:#FAFAF7;
    --ink:#1C1E1A; --muted:#878D85; --line:#E4E3DC;
    --primary:#2E7D6B; --primary-soft:#E4F0EC;
    --red:#D24B3F; --red-soft:#FBEAE8;
    --gray-soft:#EDECE6;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    color:var(--ink); display:flex; justify-content:center; padding:28px 12px 60px; min-height:100vh;
  }
  .phone{
    width:390px; max-width:100%; height:780px; background:var(--canvas);
    border-radius:34px; box-shadow:0 18px 50px rgba(30,32,28,.22), 0 0 0 10px #2a2c28;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .statusbar{display:flex; justify-content:space-between; padding:12px 24px 4px; font-size:13px; font-weight:600; flex:none;}
  .statusbar .icons{letter-spacing:2px; font-size:11px; color:#444;}
  .appbar{padding:8px 20px 4px; flex:none;}
  .appbar h1{font-size:22px; font-weight:800; letter-spacing:-.02em;}
  .appbar p{font-size:12.5px; color:var(--muted); margin-top:3px;}

  .scroll{flex:1; overflow-y:auto; padding:10px 18px 100px; scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}

  .filters{display:flex; gap:8px; padding:4px 0 14px;}
  .fchip{
    border:1px solid var(--line); background:var(--surface);
    padding:7px 13px; border-radius:99px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .fchip.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;}

  .month-cap{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em; margin:10px 0 8px;}

  .row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:9px;
  }
  .row .em{
    width:46px; height:46px; flex:none; border-radius:12px; font-size:22px;
    background:linear-gradient(150deg,#E9E7DE,#F2F0E8); display:flex; align-items:center; justify-content:center;
    filter:grayscale(.35); opacity:.9;
  }
  .row .info{flex:1; min-width:0;}
  .row .nm{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .st{font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:7px; margin-right:5px;}
  .st-used{background:var(--primary-soft); color:var(--primary);}
  .st-disc{background:var(--red-soft); color:var(--red);}
  .rebuy{
    flex:none; border:1px solid var(--primary); color:var(--primary); background:none;
    font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:99px; cursor:pointer; font-family:inherit;
  }
  .rebuy.done{border-color:var(--line); color:var(--muted); background:var(--gray-soft); pointer-events:none;}

  .empty-msg{text-align:center; color:var(--muted); font-size:13.5px; padding:34px 0; line-height:1.6;}

  .tabbar{
    position:absolute; left:0; right:0; bottom:0; height:72px; background:rgba(250,250,247,.94);
    backdrop-filter:blur(8px); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; align-items:center; padding-bottom:10px; z-index:4;
  }
  .tab{border:0; background:none; font-size:11px; color:var(--muted); cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; gap:3px; align-items:center;}
  .tab .ic{font-size:20px;}
  .tab.on{color:var(--ink); font-weight:700;}

  /* 재등록 바텀시트 */
  .dim{position:absolute; inset:0; background:rgba(20,22,18,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:8;}
  .dim.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--canvas); border-radius:22px 22px 0 0;
    padding:22px 20px 32px; transform:translateY(105%); transition:transform .25s; z-index:9;
  }
  .sheet.show{transform:translateY(0);}
  .sheet .sh-head{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .sheet .sh-em{width:44px; height:44px; border-radius:12px; font-size:22px; background:linear-gradient(150deg,#DCEAE4,#F2EFE3); display:flex; align-items:center; justify-content:center;}
  .sheet h3{font-size:16px; font-weight:800;}
  .sheet .sh-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .sheet p.guide{font-size:13px; color:var(--muted); margin:10px 0 14px; line-height:1.5;}
  .sheet label{font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px;}
  .sheet input[type=date]{
    width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:13px 14px; font-size:15px; font-family:inherit; outline:none; margin-bottom:12px;
  }
  .sheet .primary{
    width:100%; border:0; background:var(--primary); color:#fff; border-radius:14px;
    padding:15px 0; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:8px;
  }
  .sheet .ghost{
    width:100%; border:0; background:none; color:var(--muted); padding:10px 0;
    font-size:13.5px; cursor:pointer; font-family:inherit;
  }

  .toast{
    position:absolute; left:16px; right:16px; bottom:88px; background:#22241F; color:#fff;
    border-radius:14px; padding:13px 16px; font-size:13.5px; opacity:0; transform:translateY(10px);
    pointer-events:none; transition:opacity .25s, transform .25s; z-index:10;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● ▲ ▮</span></div>

  <div class="appbar">
    <h1>아카이브</h1>
    <p>소진·폐기한 물건의 이력 — 다시 살 때 원탭으로 재등록하세요</p>
  </div>

  <div class="scroll">
    <div class="filters" id="filters">
      <button class="fchip on" data-f="all">전체</button>
      <button class="fchip" data-f="used">소진</button>
      <button class="fchip" data-f="disc">폐기</button>
    </div>
    <div id="list"></div>
  </div>

  <div class="tabbar">
    <button class="tab"><span class="ic">🏠</span>홈</button>
    <button class="tab on"><span class="ic">🗂️</span>아카이브</button>
    <button class="tab"><span class="ic">⚙️</span>설정</button>
  </div>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet">
    <div class="sh-head">
      <div class="sh-em" id="shEm">💧</div>
      <div>
        <h3 id="shName">프렌즈 인공눈물</h3>
        <div class="sh-sub" id="shSub">안약 · 약장</div>
      </div>
    </div>
    <p class="guide" id="shGuide">기존 정보를 그대로 가져왔어요. 새 제품의 유통기한만 입력하면 홈에 다시 등록됩니다.</p>
    <label>유통기한</label>
    <input type="date" id="shExp">
    <button class="primary" id="shSave">홈에 재등록</button>
    <button class="ghost" id="shLater">기한은 나중에 입력할게요</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;
const $ = id => document.getElementById(id);
const fmt = dt => `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
const d = s => { const x = new Date(s); x.setHours(0,0,0,0); return x; };

/* 샘플 이력 — closedAt 내림차순 */
let items = [
  {id:1, nm:'마데카솔 연고',     em:'🩹', cat:'연고',     loc:'약장', state:'disc', closedAt:d('2026-06-10'), note:'만료(D+5)로 폐기',      rebuy:false},
  {id:2, nm:'프렌즈 인공눈물',   em:'💧', cat:'안약',     loc:'약장', state:'used', closedAt:d('2026-05-18'), note:'1개월 사용 · 4번째 구매', rebuy:false},
  {id:3, nm:'센카 클렌징폼',     em:'🧼', cat:'클렌징',   loc:'욕실', state:'used', closedAt:d('2026-04-02'), note:'3개월 사용',             rebuy:false},
  {id:4, nm:'백설 참기름',       em:'🧂', cat:'조미료',   loc:'주방', state:'used', closedAt:d('2026-03-15'), note:'5개월 사용',             rebuy:false},
  {id:5, nm:'키스미 마스카라',   em:'👁️', cat:'마스카라', loc:'욕실', state:'disc', closedAt:d('2026-02-20'), note:'개봉 6개월 초과로 폐기',  rebuy:false},
];

let filter = 'all', target = null;

function monthKey(dt){ return `${dt.getFullYear()}년 ${dt.getMonth()+1}월`; }

function render(){
  const rows = items.filter(it =>
    filter === 'all' ? true : it.state === filter);

  if (!rows.length){
    $('list').innerHTML = `<div class="empty-msg">아직 이력이 없어요.<br>홈에서 소진·폐기 처리한 물건이 여기에 모여요.</div>`;
    return;
  }

  let html = '', lastMonth = '';
  rows.forEach(it => {
    const mk = monthKey(it.closedAt);
    if (mk !== lastMonth){ html += `<div class="month-cap">${mk}</div>`; lastMonth = mk; }
    const st = it.state === 'used'
      ? `<span class="st st-used">소진</span>` : `<span class="st st-disc">폐기</span>`;
    const btn = it.rebuy
      ? `<button class="rebuy done">재등록됨 ✓</button>`
      : `<button class="rebuy" data-id="${it.id}">다시 샀어요</button>`;
    html += `<div class="row"><div class="em">${it.em}</div>
      <div class="info"><div class="nm">${it.nm}</div>
      <div class="meta">${st}${fmt(it.closedAt)} · ${it.note}</div></div>${btn}</div>`;
  });
  $('list').innerHTML = html;

  document.querySelectorAll('.rebuy[data-id]').forEach(b => b.onclick = () => openSheet(+b.dataset.id));
}

function openSheet(id){
  target = items.find(x => x.id === id);
  $('shEm').textContent = target.em;
  $('shName').textContent = target.nm;
  $('shSub').textContent = `${target.cat} · ${target.loc}`;
  $('shExp').value = '';
  $('dim').classList.add('show'); $('sheet').classList.add('show');
}
function closeSheet(){ $('dim').classList.remove('show'); $('sheet').classList.remove('show'); }
$('dim').onclick = closeSheet;

$('shSave').onclick = () => {
  if (!$('shExp').value){ toast('유통기한을 입력해 주세요'); return; }
  const exp = d($('shExp').value);
  const dday = Math.round((exp - TODAY)/DAY);
  target.rebuy = true;
  closeSheet(); render();
  toast(`${target.nm} · 홈에 재등록됨 (D-${dday})`);
};
$('shLater').onclick = () => {
  target.rebuy = true;
  closeSheet(); render();
  toast(`${target.nm} · 기한 미설정으로 재등록됨`);
};

document.querySelectorAll('.fchip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.fchip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f; render();
});

function toast(msg){
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => $('toast').classList.remove('show'), 2800);
}

render();
</script>
</body>
</html>
